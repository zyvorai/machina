# Default values for machina daemon identity configuration.
# Mount generated config.toml or inject env vars for JWT deep links and OIDC.

replicaCount: 1

image:
  repository: ghcr.io/ssahani/machina-daemon
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5092

daemon:
  host: "0.0.0.0"
  port: 5092

auth:
  pamService: sshd
  jwtSecret: "change-me-in-production"
  ldap:
    enabled: false
    url: ""
    baseDn: ""
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    redirectUrl: ""
    buttonLabel: "Sign in with SSO"
    adminGroups: []
    operatorGroups: []
  saml:
    enabled: false
    spEntityId: ""
    spAcsUrl: ""
    idpEntityId: ""
    idpMetadataUrl: ""
    nameIdFormat: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
    buttonLabel: "Sign in with SAML"

configMap:
  create: true
  name: ""
  mountPath: /etc/machina

env:
  MACHINA_JWT_SECRET: ""
  MACHINA_DAEMON_SKIP_AUTH: "0"

resources: {}
