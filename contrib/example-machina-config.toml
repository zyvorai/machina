# Example Machina daemon config — copy snippets into /etc/machina/config.toml

[auth.run_as_user]
enabled = true
mode = "sudo"  # sudo | polkit | setuid_helper
prefer_session_libvirt_on_impersonation = true

[auth.oidc]
enabled = false
issuer_url = "https://idp.example.com/realms/machina"
client_id = "machina"
redirect_url = "https://hypervisor.example.com/api/v1/auth/oidc/callback"
require_local_user_for_session_libvirt = true

[auth.saml]
enabled = false
sp_entity_id = "https://hypervisor.example.com/saml/metadata"
sp_acs_url = "https://hypervisor.example.com/api/v1/auth/saml/acs"
idp_entity_id = "https://idp.example.com/entity"
idp_metadata_url = "https://idp.example.com/metadata"

[libvirt]
dual_connection = true
uri = "qemu:///system"

[metrics_history]
interval_secs = 30
max_points = 120
persist_jsonl = true
remote_write_url = "http://127.0.0.1:9099/ingest"
# remote_write_authorization = "Bearer …"

[observability.otlp]
enabled = true
endpoint = "http://127.0.0.1:4318"
interval_secs = 60
export_metrics = true
export_logs = true
export_traces = true

[audit]
sign_lines = true

[fleet]
enabled = true
[[fleet.peers]]
name = "peer-b"
url = "https://peer-b.example.com:5092"
token = "replace-with-api-token"

[k8s_inventory_history]
enabled = true
interval_secs = 300

[openstack]
enabled = false
cloud_name = "admin"

[kubevirt]
exec_enabled = true
default_namespace = "default"
