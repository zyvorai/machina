[package]
name = "machina-controller"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Zyvor-Proprietary"

[[bin]]
name = "machina-controller"
path = "src/main.rs"

[dependencies]
machina-core = { path = "../core" }
machina-spec = { path = "../spec" }
machina-translate = { path = "../translate" }
machina-agent = { path = "../agent" }
guestkit = { path = "../../guestkit", default-features = false, features = ["guest-inspect"] }
guestkit-job-spec = { path = "../../guestkit/crates/guestkit-job-spec" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json", "migrate"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
async-nats = "0.38"
bcrypt = "0.16"
async-trait = "0.1"
tower = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
urlencoding = "2"
url = { workspace = true }
hex = "0.4"
rand = { workspace = true }
aes-gcm = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-tungstenite = "0.28"
libvirt-guac-bridge = { path = "../guac-bridge" }
bytes = "1"
