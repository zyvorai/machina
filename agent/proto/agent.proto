syntax = "proto3";
package machina.agent.v1;

service HostAgent {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);
  rpc ListStoragePools(ListStoragePoolsRequest) returns (ListStoragePoolsResponse);
  rpc ApplyVm(ApplyVmRequest) returns (ApplyVmResponse);
  rpc VmPower(VmPowerRequest) returns (VmPowerResponse);
  rpc GetDomainXml(GetDomainXmlRequest) returns (GetDomainXmlResponse);
  rpc DeleteVm(DeleteVmRequest) returns (DeleteVmResponse);
  rpc MigrateVm(MigrateVmRequest) returns (MigrateVmResponse);
  rpc Maintenance(MaintenanceRequest) returns (MaintenanceResponse);
  rpc GetConsole(GetConsoleRequest) returns (GetConsoleResponse);
  rpc GetConsoleAccessPlan(GetConsoleAccessPlanRequest) returns (GetConsoleAccessPlanResponse);
  rpc CloneVm(CloneVmRequest) returns (CloneVmResponse);
  rpc GetHostInfo(GetHostInfoRequest) returns (GetHostInfoResponse);
  rpc PrecheckMigrate(PrecheckMigrateRequest) returns (PrecheckMigrateResponse);
  rpc FenceHost(FenceHostRequest) returns (FenceHostResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc BackupVm(BackupVmRequest) returns (BackupVmResponse);
  rpc RevertSnapshot(RevertSnapshotRequest) returns (RevertSnapshotResponse);
  rpc RestoreVmBackup(RestoreVmBackupRequest) returns (RestoreVmBackupResponse);
  rpc CloneFromSnapshot(CloneFromSnapshotRequest) returns (CloneFromSnapshotResponse);
  rpc ProvisionStoragePool(ProvisionStoragePoolRequest) returns (ProvisionStoragePoolResponse);
  rpc ProvisionNetwork(ProvisionNetworkRequest) returns (ProvisionNetworkResponse);
  rpc AttachDisk(AttachDiskRequest) returns (AttachDiskResponse);
  rpc DetachDisk(DetachDiskRequest) returns (DetachDiskResponse);
  rpc ResizeDisk(ResizeDiskRequest) returns (ResizeDiskResponse);
  rpc AttachNic(AttachNicRequest) returns (AttachNicResponse);
  rpc DetachNic(DetachNicRequest) returns (DetachNicResponse);
  rpc SetAutostart(SetAutostartRequest) returns (SetAutostartResponse);
  rpc SetVcpus(SetVcpusRequest) returns (SetVcpusResponse);
  rpc SetMemory(SetMemoryRequest) returns (SetMemoryResponse);
  rpc GetVmDetails(GetVmDetailsRequest) returns (GetVmDetailsResponse);
  rpc VmLibvirtQuery(VmLibvirtQueryRequest) returns (VmLibvirtQueryResponse);
  rpc VmLibvirtInvoke(VmLibvirtInvokeRequest) returns (VmLibvirtInvokeResponse);
  rpc HostLibvirtQuery(HostLibvirtQueryRequest) returns (HostLibvirtQueryResponse);
  rpc HostLibvirtInvoke(HostLibvirtInvokeRequest) returns (HostLibvirtInvokeResponse);
  rpc GetGuestHealth(GetGuestHealthRequest) returns (GetGuestHealthResponse);
  rpc GetGuestObservability(GetGuestObservabilityRequest) returns (GetGuestObservabilityResponse);
  rpc GuestAgentAction(GuestAgentActionRequest) returns (GuestAgentActionResponse);
  rpc InstallGuestTools(InstallGuestToolsRequest) returns (InstallGuestToolsResponse);
  rpc GetFirewallInventory(GetFirewallInventoryRequest) returns (GetFirewallInventoryResponse);
  rpc ApplyFirewallPlan(ApplyFirewallPlanRequest) returns (ApplyFirewallPlanResponse);
  rpc GetFirewallActivity(GetFirewallActivityRequest) returns (GetFirewallActivityResponse);
  rpc GetGuestFirewallPorts(GetGuestFirewallPortsRequest) returns (GetGuestFirewallPortsResponse);
  rpc GetLinuxObservability(GetLinuxObservabilityRequest) returns (GetLinuxObservabilityResponse);
  rpc GetSystemdNetworkDiagnostics(GetSystemdNetworkDiagnosticsRequest) returns (GetSystemdNetworkDiagnosticsResponse);
  rpc GetLinuxAudit(GetLinuxAuditRequest) returns (GetLinuxAuditResponse);
  rpc GetLinuxPackageUpdates(GetLinuxPackageUpdatesRequest) returns (GetLinuxPackageUpdatesResponse);
  rpc ApplyLinuxPackageUpgrade(ApplyLinuxPackageUpgradeRequest) returns (ApplyLinuxPackageUpgradeResponse);
  rpc HostLinuxReboot(HostLinuxRebootRequest) returns (HostLinuxRebootResponse);
  rpc GetLinuxFilesystems(GetLinuxFilesystemsRequest) returns (GetLinuxFilesystemsResponse);
  rpc GetLinuxTopProcesses(GetLinuxTopProcessesRequest) returns (GetLinuxTopProcessesResponse);
  rpc ApplySecurityBundle(ApplySecurityBundleRequest) returns (ApplySecurityBundleResponse);
  rpc GetSecurityFabricStatus(GetSecurityFabricStatusRequest) returns (GetSecurityFabricStatusResponse);
  rpc ListPortForwards(ListPortForwardsRequest) returns (ListPortForwardsResponse);
  rpc CreatePortForward(CreatePortForwardRequest) returns (CreatePortForwardResponse);
  rpc DeletePortForward(DeletePortForwardRequest) returns (DeletePortForwardResponse);
  rpc ListHostGpus(ListHostGpusRequest) returns (ListHostGpusResponse);
}

message RegisterRequest {
  string hostname = 1;
  string address = 2;
  string agent_version = 3;
  string libvirt_uri = 4;
  string join_token = 5;
}

message RegisterResponse {
  string host_id = 1;
  bool accepted = 2;
}

message HeartbeatRequest {
  string host_id = 1;
}

message HeartbeatResponse {
  string state = 1;
  uint32 vm_count = 2;
  float cpu_percent = 3;
  uint64 memory_used_mib = 4;
  uint64 memory_total_mib = 5;
}

message VmSummary {
  string name = 1;
  string uuid = 2;
  string state = 3;
  uint32 vcpus = 4;
  uint64 memory_mb = 5;
  float cpu_percent = 6;
  uint64 memory_used_mib = 7;
  uint64 disk_read_iops = 8;
  uint64 disk_write_iops = 9;
  string guest_ip = 10;
}

message ListVmsRequest {}

message ListVmsResponse {
  repeated VmSummary vms = 1;
}

message NetworkSummary {
  string name = 1;
  string uuid = 2;
  bool active = 3;
  bool persistent = 4;
  bool autostart = 5;
  string bridge = 6;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated NetworkSummary networks = 1;
}

message StoragePoolSummary {
  string name = 1;
  string uuid = 2;
  string state = 3;
  double capacity_gib = 4;
  double used_gib = 5;
  double available_gib = 6;
  bool autostart = 7;
  string path = 8;
  string backend = 9;
}

message ListStoragePoolsRequest {}

message ListStoragePoolsResponse {
  repeated StoragePoolSummary pools = 1;
}

message ApplyVmRequest {
  string spec_json = 1;
  string disk_path = 2;
  string template_source = 3;
  string cloud_init_user = 4;
  string cloud_init_password = 5;
  string cloud_init_ssh_pubkey = 6;
}

message ApplyVmResponse {
  string vm_name = 1;
  string uuid = 2;
  bool created = 3;
}

message VmPowerRequest {
  string vm_name = 1;
  string action = 2;
  /// Optional: "agent" for guest-agent shutdown/reboot (virsh --mode=agent).
  string mode = 3;
}

message VmPowerResponse {
  string vm_name = 1;
  string state = 2;
}

message GetDomainXmlRequest {
  string vm_name = 1;
}

message GetDomainXmlResponse {
  string xml = 1;
}

message DeleteVmRequest {
  string vm_name = 1;
}

message DeleteVmResponse {
  bool deleted = 1;
}

message MigrateVmRequest {
  string vm_name = 1;
  string dest_uri = 2;
  bool live = 3;
  /// Max migration bandwidth (MiB/s); 0 = libvirt default.
  uint64 bandwidth_mib = 4;
  bool postcopy = 5;
  /// Remove source domain after successful migration (Cockpit permanent migrate).
  bool undefine_source = 6;
  /// Use tunnelled migration instead of peer-to-peer.
  bool tunnelled = 7;
  /// Disk target paths to migrate with non-shared storage (libvirt migrate_disks).
  repeated string migrate_disks = 8;
  /// Destination storage URI for disk migration (e.g. qemu+ssh://dest/system).
  string disks_uri = 9;
  /// Copy disk storage during migration (VIR_MIGRATE_NON_SHARED_DISK).
  bool copy_storage = 10;
}

message MigrateVmResponse {
  bool ok = 1;
  string message = 2;
}

message MaintenanceRequest {
  string action = 1;
  bool evacuate = 2;
}

message MaintenanceResponse {
  string state = 1;
  uint32 evacuated = 2;
}

message GetConsoleRequest {
  string vm_name = 1;
}

message GetConsoleResponse {
  string console_type = 1;
  string host = 2;
  int32 port = 3;
  int32 websocket_port = 4;
}

message GetConsoleAccessPlanRequest {
  string vm_name = 1;
}

message GetConsoleAccessPlanResponse {
  string vm_name = 1;
  string recommended = 2;
  string console_type = 3;
  string vnc_host = 4;
  int32 vnc_port = 5;
  string guest_ip = 6;
  string ssh_user = 7;
  int32 rdp_port = 8;
  string os_hint = 9;
  bool guacamole_available = 10;
  repeated string guacamole_protocols = 11;
  /// ssh_key | password | both | unknown — from cloud-init user-data when present.
  string guest_auth_mode = 12;
  /// True when the VM has a SPICE graphics device (even if VNC is also present).
  bool has_spice = 13;
}

message CloneVmRequest {
  string source_name = 1;
  string new_name = 2;
  string spec_json = 3;
  /// linked (default), full, or xml (legacy shared disk)
  string clone_mode = 4;
}

message CloneVmResponse {
  string vm_name = 1;
  string uuid = 2;
}

message GetHostInfoRequest {}

message GetHostInfoResponse {
  string cpu_model = 1;
  string libvirt_version = 2;
  string qemu_version = 3;
}

message PrecheckMigrateRequest {
  string vm_name = 1;
  string dest_cpu_model = 2;
  string dest_libvirt_version = 3;
}

message MigrateCheckItem {
  string name = 1;
  bool passed = 2;
  string message = 3;
}

message PrecheckMigrateResponse {
  bool ok = 1;
  repeated MigrateCheckItem checks = 2;
}

message FenceHostRequest {
  string action = 1;
  string method = 2;
  string ipmi_address = 3;
  string ipmi_username = 4;
  string ipmi_password = 5;
  string shell_command = 6;
  string hostname = 7;
}

message FenceHostResponse {
  bool ok = 1;
  string message = 2;
}

message CreateSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string description = 3;
  bool disk_only = 4;
  bool quiesce = 5;
  string storage_mode = 6;
}

message CreateSnapshotResponse {
  bool ok = 1;
  string snapshot_name = 2;
  string message = 3;
  string disk_path = 4;
}

message DeleteSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message DeleteSnapshotResponse {
  bool deleted = 1;
}

message SnapshotInfo {
  string name = 1;
  string state = 2;
  int64 creation_time = 3;
  bool is_current = 4;
}

message ListSnapshotsRequest {
  string vm_name = 1;
}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
}

message BackupVmRequest {
  string vm_name = 1;
  string dest_path = 2;
}

message BackupVmResponse {
  bool ok = 1;
  string path = 2;
  string message = 3;
}

message RevertSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
}

message RevertSnapshotResponse {
  bool ok = 1;
  string message = 2;
}

message RestoreVmBackupRequest {
  string vm_name = 1;
  string backup_path = 2;
}

message RestoreVmBackupResponse {
  bool ok = 1;
  string message = 2;
}

message CloneFromSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string new_name = 3;
  string new_disk_path = 4;
  bool revert_source = 5;
}

message CloneFromSnapshotResponse {
  bool ok = 1;
  string vm_name = 2;
  string uuid = 3;
  string message = 4;
}

message ProvisionStoragePoolRequest {
  string pool_name = 1;
  string backend = 2;
  string path = 3;
}

message ProvisionStoragePoolResponse {
  bool ok = 1;
  string message = 2;
}

message ProvisionNetworkRequest {
  string network_name = 1;
  string backend = 2;
  int32 vlan_id = 3;
  string bridge = 4;
}

message ProvisionNetworkResponse {
  bool ok = 1;
  string message = 2;
}

message AttachDiskRequest {
  string vm_name = 1;
  string disk_path = 2;
  string target_dev = 3;
}

message AttachDiskResponse {
  bool ok = 1;
  string message = 2;
}

message DetachDiskRequest {
  string vm_name = 1;
  string target_dev = 2;
}

message DetachDiskResponse {
  bool ok = 1;
  string message = 2;
}

message ResizeDiskRequest {
  string vm_name = 1;
  string target_dev = 2;
  uint64 size_gb = 3;
}

message ResizeDiskResponse {
  bool ok = 1;
  string message = 2;
}

message AttachNicRequest {
  string vm_name = 1;
  string network = 2;
  string model = 3;
}

message AttachNicResponse {
  bool ok = 1;
  string message = 2;
}

message DetachNicRequest {
  string vm_name = 1;
  string mac_address = 2;
}

message DetachNicResponse {
  bool ok = 1;
  string message = 2;
}

message SetAutostartRequest {
  string vm_name = 1;
  bool enabled = 2;
}

message SetAutostartResponse {
  bool ok = 1;
  string message = 2;
}

message SetVcpusRequest {
  string vm_name = 1;
  uint32 count = 2;
}

message SetVcpusResponse {
  bool ok = 1;
  string message = 2;
}

message SetMemoryRequest {
  string vm_name = 1;
  uint64 memory_mb = 2;
}

message SetMemoryResponse {
  bool ok = 1;
  string message = 2;
}

message GetVmDetailsRequest {
  string vm_name = 1;
}

message GetVmDetailsResponse {
  bool ok = 1;
  string details_json = 2;
  string message = 3;
}

message VmLibvirtQueryRequest {
  string vm_name = 1;
  string action = 2;
  string payload_json = 3;
}

message VmLibvirtQueryResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message VmLibvirtInvokeRequest {
  string vm_name = 1;
  string action = 2;
  string payload_json = 3;
}

message VmLibvirtInvokeResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message HostLibvirtQueryRequest {
  string action = 1;
  string payload_json = 2;
}

message HostLibvirtQueryResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message HostLibvirtInvokeRequest {
  string action = 1;
  string payload_json = 2;
}

message HostLibvirtInvokeResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message GetGuestHealthRequest {
  string vm_name = 1;
}

message GetGuestHealthResponse {
  bool ok = 1;
  string state = 2;
  bool agent_reachable = 3;
  bool healthy = 4;
  string os_pretty_name = 5;
  string guest_ip = 6;
  string guest_hostname = 7;
  repeated string issues = 8;
  string install_state = 9;
  bool channel_attached = 10;
  bool channel_connected = 11;
  bool agent_ping = 12;
  string agent_version = 13;
  string diagnostics_json = 14;
}

message GetGuestObservabilityRequest {
  string vm_name = 1;
}

message GetGuestObservabilityResponse {
  bool ok = 1;
  string guest_json = 2;
  string message = 3;
}

message GuestAgentActionRequest {
  string vm_name = 1;
  /// sync_time | fstrim | fs_freeze_status
  string action = 2;
}

message GuestAgentActionResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message InstallGuestToolsRequest {
  string vm_name = 1;
}

message InstallGuestToolsResponse {
  bool ok = 1;
  string message = 2;
}

message GetFirewallInventoryRequest {}

message GetFirewallInventoryResponse {
  bool ok = 1;
  string inventory_json = 2;
  string message = 3;
}

message ApplyFirewallPlanRequest {
  string plan_json = 1;
  bool dry_run = 2;
}

message ApplyFirewallPlanResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message GetFirewallActivityRequest {
  uint32 hours = 1;
}

message GetFirewallActivityResponse {
  bool ok = 1;
  string activity_json = 2;
  string message = 3;
}

message GuestFirewallPort {
  uint32 port = 1;
  string protocol = 2;
  string bind_address = 3;
  string process = 4;
}

message GetGuestFirewallPortsRequest {
  string vm_name = 1;
}

message GetGuestFirewallPortsResponse {
  bool ok = 1;
  bool agent_reachable = 2;
  repeated GuestFirewallPort ports = 3;
  string message = 4;
}

message GetLinuxObservabilityRequest {}

message GetLinuxObservabilityResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message GetSystemdNetworkDiagnosticsRequest {}

message GetSystemdNetworkDiagnosticsResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message GetLinuxAuditRequest {}

message GetLinuxAuditResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message GetLinuxPackageUpdatesRequest {}

message GetLinuxPackageUpdatesResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message ApplyLinuxPackageUpgradeRequest {
  bool dry_run = 1;
}

message ApplyLinuxPackageUpgradeResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message HostLinuxRebootRequest {}

message HostLinuxRebootResponse {
  bool ok = 1;
  string message = 2;
}

message GetLinuxFilesystemsRequest {}

message GetLinuxFilesystemsResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message GetLinuxTopProcessesRequest {
  uint32 limit = 1;
  string order = 2;
}

message GetLinuxTopProcessesResponse {
  bool ok = 1;
  string json = 2;
  string message = 3;
}

message ApplySecurityBundleRequest {
  string bundle_json = 1;
  bool dry_run = 2;
}

message ApplySecurityBundleResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message GetSecurityFabricStatusRequest {}

message GetSecurityFabricStatusResponse {
  bool ok = 1;
  string status_json = 2;
  string message = 3;
}

message PortForwardRuleMsg {
  string id = 1;
  string protocol = 2;
  uint32 host_port = 3;
  string vm_ip = 4;
  uint32 vm_port = 5;
  string description = 6;
}

message ListPortForwardsRequest {}

message ListPortForwardsResponse {
  repeated PortForwardRuleMsg rules = 1;
  string message = 2;
}

message CreatePortForwardRequest {
  string protocol = 1;
  uint32 host_port = 2;
  string vm_ip = 3;
  uint32 vm_port = 4;
  string description = 5;
}

message CreatePortForwardResponse {
  bool ok = 1;
  string message = 2;
}

message DeletePortForwardRequest {
  string protocol = 1;
  uint32 host_port = 2;
  string vm_ip = 3;
  uint32 vm_port = 4;
}

message DeletePortForwardResponse {
  bool ok = 1;
  string message = 2;
}

message ListHostGpusRequest {}

message HostGpuDevice {
  string pci_address = 1;
  string vendor = 2;
  string device_name = 3;
  uint32 iommu_group = 4;
  string mig_profile = 5;
}

message ListHostGpusResponse {
  repeated HostGpuDevice devices = 1;
  string nvidia_smi_summary = 2;
}
