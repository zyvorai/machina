[package]
name = "machina-agent"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Zyvor-Production-1.0"

[[bin]]
name = "machina-agent"
path = "src/main.rs"

[dependencies]
machina-core = { path = "../core" }
machina-spec = { path = "../spec" }
machina-translate = { path = "../translate" }
machina-bpf = { path = "../bpf/machina-bpf" }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
prost = "0.14"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
anyhow = { workspace = true }
virt = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tokio-tungstenite = "0.30"
http = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"
