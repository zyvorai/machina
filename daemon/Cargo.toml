[package]
license = "LicenseRef-Zyvor-Proprietary"
name = "machina-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
machina-core = { path = "../core" }
virt-image-build = { path = "../virt-image-build" }
uuid = { workspace = true }
virt = { workspace = true }
libvirt-guac-bridge = { path = "../guac-bridge" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
dns-lookup = "2.0"
axum-server = { workspace = true }
sd-notify = "0.4"
jsonwebtoken = "9.3"
# rustls 0.23 requires an explicit process default CryptoProvider when deps enable multiple backends.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
portable-pty = { workspace = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
ldap3 = { version = "0.11", default-features = false, features = ["sync", "tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
pam = { workspace = true }
