name: Release

# Tag vX.Y.Z (or vX.Y.Z-rc1) → build on the oldest supported distro, package (deb, rpm, offline bundle), run the
# packages on that distro as a gate, sign, and publish a GitHub Release with SHA256SUMS and an SBOM.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing (e.g. 0.2.0-rc1)"
        required: true

permissions:
  contents: read

# The binaries link the build runner's glibc and libvirt (ubuntu-22.04 here), so they run on that release and newer.
# Raise the floor deliberately; the verify-deb job proves the packages run on it.

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Checkout machina
        uses: actions/checkout@v4
        with:
          path: machina
      - name: Checkout guestkit (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: hypersdk/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (pinned 2026-07-24)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (floating tag, pinned 2026-07-24)
        with:
          workspaces: machina
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvirt-dev libpam0g-dev libclang-dev clang protobuf-compiler libssl-dev
      # Without the nightly toolchain and bpf-linker the eBPF programs are not compiled and bpfd ships empty.
      - name: eBPF toolchain
        working-directory: machina
        run: make bpf-deps
      - name: Build (release)
        working-directory: machina
        run: cargo build --workspace --release --locked
      - name: Build controller (PostgreSQL build)
        working-directory: machina
        run: make release-pg CARGO_FLAGS=--locked
      - name: eBPF programs are compiled into bpfd
        working-directory: machina
        run: ./target/release/machina-bpfd --probe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machina/web/package-lock.json
      - name: Build web UI
        working-directory: machina/web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Package
        working-directory: machina
        run: |
          ./scripts/release/build-release.sh --version "${{ steps.v.outputs.version }}" \
            --bin-dir target/release --web-dir web/dist --out "$PWD/dist/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: machina/dist/release/*
          if-no-files-found: error

  # The gate that makes the compatibility claim true: install the real packages on the oldest target and start the binaries.
  verify-deb:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Checksums
        run: cd release && sha256sum -c SHA256SUMS
      - name: Install on a clean Ubuntu 22.04 and run
        run: |
          docker run --rm -v "$PWD/release:/pk:ro" ubuntu:22.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive MACHINA_NO_START=1
            apt-get update -qq
            apt-get install -y ./pk/machina_*.deb ./pk/machina-controller_*.deb ./pk/machina-agent_*.deb
            machina-daemon --help >/dev/null
            machina-controller --help >/dev/null
            machina-agent --help >/dev/null
            machina-bpfd --help >/dev/null
            test -s /etc/default/machina-platform && test -s /etc/machina/INITIAL_ADMIN_PASSWORD
            # a reinstall keeps the credentials
            s=$(sha256sum /etc/default/machina-platform)
            apt-get install -y --reinstall ./pk/machina-controller_*.deb
            test "$s" = "$(sha256sum /etc/default/machina-platform)"
          '

  verify-rpm:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Install on a clean Fedora and inspect
        run: |
          docker run --rm -v "$PWD/release:/pk:ro" fedora:latest bash -euxc '
            export MACHINA_NO_START=1
            dnf install -y --setopt=install_weak_deps=False /pk/machina-0*.rpm /pk/machina-controller-0*.rpm /pk/machina-agent-0*.rpm
            test -x /usr/bin/machina-controller
            test -s /etc/default/machina-platform
          '

  publish:
    needs: [build, verify-deb, verify-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write      # create the release
      id-token: write      # keyless signing (sigstore)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        working-directory: release
        run: |
          for f in SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" release/* $pre --title "Machina ${tag#v}" --generate-notes
