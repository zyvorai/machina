# Demo controller for trying the web API and joining a node. Not a production layout: one container, SQLite on a volume.
#   cp .env.example .env      # set the three secrets
#   cp /path/to/release/machina-controller .
#   docker compose up -d --build
services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    restart: unless-stopped
    environment:
      MACHINA_CONTROLLER_HOST: "0.0.0.0"
      MACHINA_CONTROLLER_PORT: "5093"
      DATABASE_URL: "sqlite:///var/lib/machina/controller.db"
      MACHINA_JWT_SECRET: "${MACHINA_JWT_SECRET:?set MACHINA_JWT_SECRET in .env (openssl rand -hex 32)}"
      MACHINA_ADMIN_USER: "${MACHINA_ADMIN_USER:-admin}"
      MACHINA_ADMIN_PASSWORD: "${MACHINA_ADMIN_PASSWORD:?set MACHINA_ADMIN_PASSWORD in .env}"
      # What nodes use to reach this controller: the address of the Docker host, not the container.
      MACHINA_PUBLIC_URL: "${MACHINA_PUBLIC_URL:?set MACHINA_PUBLIC_URL in .env, e.g. http://203.0.113.10:5093}"
      MACHINA_CONTROLLER_TLS_ADDR: "0.0.0.0:5094"
      MACHINA_CONTROLLER_TLS_SANS: "${MACHINA_TLS_SANS:-}"
      RUST_LOG: "info"
    ports:
      - "5093:5093"
      - "5094:5094"
    volumes:
      - machina-data:/var/lib/machina
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5093/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  machina-data: {}
