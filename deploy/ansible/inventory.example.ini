# One controller, any number of compute nodes. Copy to inventory.ini and edit.
[machina_controller]
ctl1 ansible_host=203.0.113.10

[machina_agents]
node1 ansible_host=203.0.113.21
node2 ansible_host=203.0.113.22

[all:vars]
ansible_user=ubuntu
ansible_become=true

[machina_controller:vars]
# The address nodes use to reach this controller. The join command is built from it.
machina_public_url=http://203.0.113.10:5093
# Where the controller listens for joining nodes (HTTPS, fleet-CA certificate). Open it to the nodes only.
machina_tls_addr=0.0.0.0:5094
# Extra names/IPs for the join listener's certificate (the host of machina_public_url is added for you).
machina_tls_sans=203.0.113.10
